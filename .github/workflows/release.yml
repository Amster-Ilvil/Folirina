name: Build and publish Folirina releases

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "README.md"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "pyproject.toml"
      - "run_gui.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folirina-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Core quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install audit dependencies
        run: |
          python -m pip install -U pip wheel setuptools
          python -m pip install ".[gui,dev]"
      - name: Privacy audit
        run: python scripts/privacy_audit.py
      - name: Full release quality gate
        run: python scripts/release_quality_gate.py
      - name: Runtime selftest
        # Run the synthetic end-to-end runtime probe as its own OS-bounded step.
        # Native CV/font runtimes may keep process-global worker pools until the
        # interpreter exits; isolating this from the static gate prevents a
        # successful release audit from being held open by a leaked worker.
        run: FOLIRINA_SELFTEST_TIMEOUT=120 python scripts/run_runtime_selftest.py

  metadata:
    name: Version metadata
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib, re
          a=pathlib.Path('src/manga_hd_transfer/version.py').read_text(encoding='utf-8')
          b=pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          va=re.search(r'^\s*__version__\s*=\s*["\x27]([^"\x27]+)',a,re.M).group(1)
          vb=re.search(r'^version\s*=\s*["\x27]([^"\x27]+)',b,re.M).group(1)
          if va != vb: raise SystemExit(f'version mismatch: {va} != {vb}')
          print(va)
          PY
          )"
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "$TAG" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Folirina version ${VERSION}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip wheel setuptools pyinstaller
      - run: python -m pip install ".[gui]"
      - run: python scripts/verify_desktop_assets.py
      - run: python -m compileall -q src run_gui.py scripts/build_desktop.py scripts/verify_desktop_assets.py
      - run: python scripts/build_desktop.py --clean
      - name: Verify Windows branding
        shell: pwsh
        run: |
          if (!(Test-Path 'assets/icon.ico')) { throw 'Windows ICO missing' }
          if (!(Test-Path 'dist/Folirina/Folirina.exe')) { throw 'Folirina.exe missing' }
          $runtimeIcon = Get-ChildItem -Path 'dist/Folirina' -Recurse -Filter 'folirina_app_icon.ico' | Select-Object -First 1
          if ($null -eq $runtimeIcon) { throw 'Packaged runtime ICO missing' }
      - shell: pwsh
        run: Compress-Archive -Path 'dist/Folirina' -DestinationPath "Folirina_${env:VERSION}_Windows_x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Folirina-Windows-x64
          path: Folirina_${{ env.VERSION }}_Windows_x64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS ${{ matrix.label }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: AppleSilicon
            arch: arm64
          - os: macos-15-intel
            label: Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PRODUCT_NAME: Folirina
      DMG_BASENAME: Folirina_${{ needs.metadata.outputs.version }}_macOS_${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: test "$(uname -m)" = "$ARCH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip wheel setuptools pyinstaller
      - run: python -m pip install ".[gui]"
      - run: python scripts/verify_desktop_assets.py
      - run: python -m compileall -q src run_gui.py scripts/build_desktop.py scripts/verify_desktop_assets.py
      - name: Build application
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: python scripts/build_desktop.py --clean
      - name: Verify executable architecture
        shell: bash
        run: |
          set -euo pipefail
          APP='dist/Folirina.app'; EXE="$APP/Contents/MacOS/Folirina"
          test -x "$EXE"
          /usr/bin/file "$EXE" | grep -q "$ARCH"
          plutil -lint "$APP/Contents/Info.plist"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")
          test -n "$ICON_NAME"
          test -f "$APP/Contents/Resources/$ICON_NAME"
      - name: Build and verify DMG
        run: bash scripts/build_macos_dmg.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: Folirina-macOS-${{ matrix.label }}
          path: |
            package/Folirina_${{ env.VERSION }}_macOS_${{ matrix.label }}.dmg
            package/Folirina_${{ env.VERSION }}_macOS_${{ matrix.label }}.app.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libx11-xcb1 libfontconfig1
      - run: python -m pip install -U pip wheel setuptools pyinstaller
      - run: python -m pip install ".[gui]"
      - run: python scripts/verify_desktop_assets.py
      - run: python -m compileall -q src run_gui.py scripts/build_desktop.py scripts/verify_desktop_assets.py
      - run: python scripts/build_desktop.py --clean
      - run: test -f dist/Folirina/Folirina.desktop && test -f dist/Folirina/folirina.png
      - run: tar -C dist -czf "Folirina_${VERSION}_Linux_x64.tar.gz" Folirina
      - uses: actions/upload-artifact@v4
        with:
          name: Folirina-Linux-x64
          path: Folirina_${{ env.VERSION }}_Linux_x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [metadata, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "downloaded/Folirina-Windows-x64/Folirina_${VERSION}_Windows_x64.zip" release-assets/
          cp "downloaded/Folirina-macOS-AppleSilicon/Folirina_${VERSION}_macOS_AppleSilicon.dmg" release-assets/
          cp "downloaded/Folirina-macOS-AppleSilicon/Folirina_${VERSION}_macOS_AppleSilicon.app.zip" release-assets/
          cp "downloaded/Folirina-macOS-Intel/Folirina_${VERSION}_macOS_Intel.dmg" release-assets/
          cp "downloaded/Folirina-macOS-Intel/Folirina_${VERSION}_macOS_Intel.app.zip" release-assets/
          cp "downloaded/Folirina-Linux-x64/Folirina_${VERSION}_Linux_x64.tar.gz" release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat > release-assets/BUILD-INFO.txt <<EOF
          Folirina ${RELEASE_TAG}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Core quality gate: PASS
          Privacy audit: PASS
          Optional OCR/ML model weights bundled: no; managed on demand by Folirina
          Accelerator policy: Windows/Linux NVIDIA CUDA -> macOS Apple MPS -> CPU fallback
          Desktop icon branding: native ICNS / ICO / PNG + bundled runtime icons
          macOS signing: ad-hoc (not notarized)
          EOF
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          ## Folirina ${RELEASE_TAG}
          Multi-platform build from a clean checkout after the full core quality gate and privacy audit.
          See SHA256SUMS.txt and BUILD-INFO.txt for verification.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Folirina ${RELEASE_TAG}" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Folirina ${RELEASE_TAG}" --notes-file "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
