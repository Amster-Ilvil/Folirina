name: Build and publish Folirina releases

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".release/**"
      - "run_gui.py"
      - "pyproject.toml"
      - ".gitignore"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".release/**"
      - "run_gui.py"
      - "pyproject.toml"
      - ".gitignore"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folirina-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Privacy audit and release smoke
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Privacy audit
        run: python scripts/privacy_audit.py
      - name: Release source smoke test
        run: python scripts/release_smoke.py
      - name: Compile check
        run: python -m compileall -q src scripts run_gui.py
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path('src/manga_hd_transfer/version.py').read_text(encoding='utf-8')
          m = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)["\x27]', text, re.M)
          if not m:
              raise SystemExit('Folirina __version__ not found')
          print(m.group(1))
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip wheel setuptools pyinstaller
          pip install -e ".[gui]"
      - name: Build application
        shell: pwsh
        run: python scripts/build_desktop.py --clean
      - name: Frozen runtime checks
        shell: pwsh
        run: |
          & "dist/Folirina/Folirina.exe" --release-selfcheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/Folirina/Folirina.exe" --direct-v234-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path 'dist/Folirina' -DestinationPath "Folirina_${env:VERSION}_Windows_x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Folirina-Windows-x64
          path: Folirina_${{ env.VERSION }}_Windows_x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    name: macOS ${{ matrix.label }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: AppleSilicon
            arch: arm64
          - os: macos-15-intel
            label: Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PRODUCT_NAME: Folirina
      DMG_BASENAME: Folirina_${{ needs.metadata.outputs.version }}_macOS_${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS: $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "$ARCH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel setuptools pyinstaller
          pip install -e ".[gui]"
      - name: Build application
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: python scripts/build_desktop.py --clean
      - name: Verify executable and frozen runtimes
        shell: bash
        run: |
          set -euo pipefail
          APP='dist/Folirina.app'
          EXE="$APP/Contents/MacOS/Folirina"
          test -x "$EXE"
          /usr/bin/file "$EXE" | grep -q "$ARCH"
          plutil -lint "$APP/Contents/Info.plist"
          "$EXE" --release-selfcheck
          "$EXE" --direct-v234-probe
      - name: Build and verify DMG
        shell: bash
        run: bash scripts/build_macos_dmg.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: Folirina-macOS-${{ matrix.label }}
          path: |
            package/Folirina_${{ env.VERSION }}_macOS_${{ matrix.label }}.dmg
            package/Folirina_${{ env.VERSION }}_macOS_${{ matrix.label }}.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux:
    name: Linux x64
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux GUI libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel setuptools pyinstaller
          pip install -e ".[gui]"
      - name: Build application
        shell: bash
        run: python scripts/build_desktop.py --clean
      - name: Frozen runtime checks
        shell: bash
        run: |
          set -euo pipefail
          dist/Folirina/Folirina --release-selfcheck
          dist/Folirina/Folirina --direct-v234-probe
      - name: Package Linux
        shell: bash
        run: tar -C dist -czf "Folirina_${VERSION}_Linux_x64.tar.gz" Folirina
      - uses: actions/upload-artifact@v4
        with:
          name: Folirina-Linux-x64
          path: Folirina_${{ env.VERSION }}_Linux_x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [metadata, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          cat > release-assets/BUILD-INFO.txt <<EOF
          Folirina ${RELEASE_TAG}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Python: 3.11
          Privacy audit: PASS
          Direct runtime: exact v2.3.4 Contract Guard + v2.3.13 strict semantic-mask guard
          Direct archive SHA-256: 63d1df8d9bff426f22362a777ce7fe33e25da4aa9f68ad6f31053847a5607bc5
          macOS signing: ad-hoc
          Optional OCR/model weights: not bundled; installed/downloaded on demand
          EOF
          (cd release-assets && sha256sum Folirina_* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          ## Folirina ${RELEASE_TAG}

          Multi-platform desktop release built from a clean GitHub Actions checkout.

          - Windows x64 portable build.
          - macOS Apple Silicon native arm64 `.dmg` and `.app.zip`.
          - macOS Intel native x86_64 `.dmg` and `.app.zip`.
          - Linux x64 portable build.
          - Direct keeps the exact locked v2.3.4 runtime with the v2.3.13 strict semantic-mask guard.
          - Optional OCR, Torch and model runtimes are not bundled; Folirina installs/downloads them on demand.
          - Every build runs a frozen-runtime self-check and Direct isolation probe before publication.

          See `SHA256SUMS.txt` and `BUILD-INFO.txt` for verification details.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Folirina ${RELEASE_TAG}" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Folirina ${RELEASE_TAG}" --notes-file "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for name in \
            "Folirina_${VERSION}_Windows_x64.zip" \
            "Folirina_${VERSION}_macOS_AppleSilicon.dmg" \
            "Folirina_${VERSION}_macOS_AppleSilicon.app.zip" \
            "Folirina_${VERSION}_macOS_Intel.dmg" \
            "Folirina_${VERSION}_macOS_Intel.app.zip" \
            "Folirina_${VERSION}_Linux_x64.tar.gz" \
            SHA256SUMS.txt BUILD-INFO.txt
          do
            grep -qx "$name" <<< "$ASSETS"
          done
          gh release view "$RELEASE_TAG" --json url,name,tagName,isDraft,isPrerelease,assets \
            --jq '{url,name,tagName,isDraft,isPrerelease,assets:[.assets[].name]}'
