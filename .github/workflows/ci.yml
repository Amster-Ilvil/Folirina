name: CI

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # PySide6/pytest-qt are deliberately isolated in gui-e2e.yml; keep the
      # core matrix lightweight while still running every non-GUI regression.
      - run: pytest --ignore=tests/test_gui_aligned_overlay_e2e.py
      - run: mhd-transfer selftest
